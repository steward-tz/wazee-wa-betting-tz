name: Deploy Wazee wa Betting TZ

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build production bundle
        run: pnpm run build
      - name: Create static Pages entrypoint
        shell: bash
        run: |
          set -euo pipefail
          css_file=$(find .output/public/assets -maxdepth 1 -name 'styles-*.css' -printf '%f\n' | head -1)
          js_file=$(find .output/public/assets -maxdepth 1 -name 'index-*.js' -printf '%f\n' | head -1)
          test -n "$css_file"
          test -n "$js_file"
          cat > .output/public/index.html <<HTML
          <!doctype html>
          <html lang="sw">
            <head>
              <meta charset="UTF-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1.0" />
              <meta name="description" content="Wazee wa Betting TZ — tips, mikeka na jamii ya michezo Tanzania." />
              <meta name="theme-color" content="#071714" />
              <title>Wazee wa Betting TZ</title>
              <link rel="stylesheet" href="./assets/$css_file" />
            </head>
            <body>
              <div id="root"></div>
              <script type="module" src="./assets/$js_file"></script>
            </body>
          </html>
          HTML
          cp .output/public/index.html .output/public/404.html
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
